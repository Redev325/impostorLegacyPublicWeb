name: Optimize HTML5 Artifact

on:
  workflow_run:
    workflows: ["Build HTML5 Web Port"]
    types: [completed]

concurrency:
  group: html5-pages-deploy
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  optimize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository for favicon
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download successful HTML5 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "Finding HTML5 artifact from workflow run ${RUN_ID}..."
          ARTIFACT_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "impostor-legacy-html5-lean") | select(.expired == false) | .id' | head -n 1)"
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "ERROR: Could not find impostor-legacy-html5-lean artifact."
            exit 1
          fi
          echo "Artifact ID: ${ARTIFACT_ID}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          mkdir extracted
          unzip -q artifact.zip -d extracted
          rm -f artifact.zip
          echo "Downloaded artifact contents:"
          find extracted -maxdepth 2 -type f | head -20

      - name: Install lossless image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng jpegoptim parallel

      - name: Fast lossless PNG optimization
        shell: bash
        run: |
          set -euo pipefail
          ROOT="extracted"
          BEFORE="$(du -sb "${ROOT}" | cut -f1)"
          echo "Scanning PNG assets larger than 512 KB..."
          mapfile -d '' PNGS < <(find "$ROOT" -type f -iname '*.png' -size +512k -print0)
          TOTAL="${#PNGS[@]}"
          echo "PNG files selected: ${TOTAL}"

          if [ "$TOTAL" -gt 0 ]; then
            printf '%s\0' "${PNGS[@]}" | parallel --null --jobs 2 --halt soon,fail=1 'optipng -quiet -strip all -o1 "{}" >/dev/null 2>&1 || true'
          fi

          AFTER="$(du -sb "${ROOT}" | cut -f1)"
          SAVED=$((BEFORE - AFTER))
          echo "Lossless PNG optimization completed."
          echo "Bytes saved: ${SAVED}"
          echo "Optimized artifact size:"
          du -sh "$ROOT"

      - name: Fast lossless JPEG optimization
        shell: bash
        run: |
          set -euo pipefail
          ROOT="extracted"
          echo "Scanning JPEG assets larger than 512 KB..."
          mapfile -d '' JPEGS < <(find "$ROOT" -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -size +512k -print0)
          TOTAL="${#JPEGS[@]}"
          echo "JPEG files selected: ${TOTAL}"

          if [ "$TOTAL" -gt 0 ]; then
            printf '%s\0' "${JPEGS[@]}" | parallel --null --jobs 2 --halt soon,fail=1 'jpegoptim --quiet --strip-all "{}" >/dev/null 2>&1 || true'
          fi

          echo "Lossless JPEG optimization completed."
          du -sh "$ROOT"

      - name: Add favicon to HTML5 package
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(find extracted -type f -name index.html -print -quit)"
          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi
          BUILD_ROOT="$(dirname "$INDEX")"

          if [ -f favicon.png ]; then
            cp -f favicon.png "$BUILD_ROOT/favicon.png"
            echo "Added repository favicon.png to: $BUILD_ROOT/favicon.png"
          else
            echo "No repository favicon.png found; leaving existing build favicon unchanged."
          fi

      - name: Verify required HTML5 files
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(find extracted -type f -name index.html -print -quit)"
          JS="$(find extracted -type f -name ImpostorLegacy.js -print -quit)"
          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html was lost during optimization."
            exit 1
          fi
          if [ -z "$JS" ]; then
            echo "ERROR: ImpostorLegacy.js was lost during optimization."
            exit 1
          fi
          echo "Verified: $INDEX"
          echo "Verified: $JS"

          if [ -f favicon.png ]; then
            BUILD_ROOT="$(dirname "$INDEX")"
            test -f "$BUILD_ROOT/favicon.png"
            echo "Verified repository favicon was copied into the build."
          fi

      - name: Save small HTML5 JS diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          JS="$(find extracted -type f -name ImpostorLegacy.js -print -quit)"
          if [ -z "$JS" ]; then
            echo "ERROR: ImpostorLegacy.js not found."
            exit 1
          fi
          mkdir -p js-diagnostic
          cp "$JS" js-diagnostic/ImpostorLegacy.js
          MAP="$(find extracted -type f \( -name 'ImpostorLegacy.js.map' -o -name '*.js.map' \) -print -quit || true)"
          if [ -n "$MAP" ]; then cp "$MAP" js-diagnostic/$(basename "$MAP"); fi
          ls -lh js-diagnostic
      - name: Upload small HTML5 JS diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: html5-js-diagnostic
          path: js-diagnostic
          retention-days: 3

      - name: Upload optimized HTML5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: impostor-legacy-html5-optimized
          path: extracted
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # A retry creates a new artifact for the same workflow run. Include
          # the attempt number so deploy-pages never sees duplicate names.
          name: github-pages-${{ github.run_attempt }}
          path: extracted

      - name: Deploy game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
